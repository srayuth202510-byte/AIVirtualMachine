name: coder

runtime:
  isolation: sandbox
  # ตัวอย่าง isolation ระดับ microvm — ต้อง build ด้วย `--features microvm`
  # พร้อมบล็อก pins ข้างล่าง (ดู docs/microvm.md วิธีเตรียม pins.json):
  # isolation: microvm
# microvm:
#   kernel_path: /home/USER/.local/share/aivm/microvm/vmlinux.bin
#   kernel_sha256: "<sha256 64 hex ของไฟล์ข้างบน>"
#   rootfs_path: /home/USER/.local/share/aivm/microvm/hello-rootfs.ext4
#   rootfs_sha256: "<sha256 64 hex ของไฟล์ข้างบน>"
#   fc_sha256: "<sha256 ของไบนารี firecracker>"   # ไม่ตั้ง = ไม่ pin VMM
#   vcpu_count: 1      # 1..=32
#   mem_mb: 256        # 64..=32768
#   boot_timeout_secs: 60   # 5..=600
#   alt_kernel: { path: /path/vmlinux2.bin, sha256: "<64 hex>" }  # G5 DNA (verify ทุกชุด สุ่มใช้ต่อบูต)
#   alt_rootfs: { path: /path/rootfs2.ext4, sha256: "<64 hex>" }
#   dna_jitter: false     # true = สุ่มลด vcpu/mem ไม่เกิน 25% ต่อบูต
#   jailer:                  # Optional: ใช้ jailer wrap firecracker (ต้อง root)
#     jailer_path: ""        # "" = หาใน PATH, หรือระบุ path เต็ม
#     jailer_id: ""          # "" = auto-generate
#     chroot: true           # chroot isolation
#     cgroup: true           # cgroup v2 isolation
#     namespace: true        # namespace isolation (pid, net, mnt, ipc, uts)
#     drop_caps: true        # drop all capabilities
#     no_new_privs: true     # no new privileges
# ตัวอย่าง isolation ระดับ hardware (TEE skeleton) — ต้อง build ด้วย
# `--features hardware` พร้อมบล็อก pins ข้างล่าง (ดู docs/hardware.md):
# isolation: hardware
# hardware:
#   tee_type: generic            # sevsnp | tdx | generic (generic = จำลอง ไม่ isolate จริง)
#   attestation_mode: none       # strict | best_effort | none (generic + strict = บูตไม่ขึ้น)
#   kernel_path: /home/USER/.local/share/aivm/hardware/vmlinux.bin
#   kernel_sha256: "<sha256 64 hex ของไฟล์ข้างบน>"
#   rootfs_path: /home/USER/.local/share/aivm/hardware/rootfs.ext4
#   rootfs_sha256: "<sha256 64 hex ของไฟล์ข้างบน>"
#   qemu_sha256: "<sha256 ของไบนารี qemu-system-x86_64>"  # ไม่ตั้ง = ไม่ pin VMM
#   vcpu_count: 2      # 1..=256
#   mem_mb: 2048       # 1024..=1048576
#   launch_timeout_secs: 120   # 10..=1800

model:
  provider: echo
  name: echo
  # ตัวอย่างแบ็กเอนด์ local (GGUF) — ต้อง build ด้วย `--features llama`:
  #   provider: local
  #   name: my-gguf
  #   local:
  #     model_path: /models/model.gguf
  #     ctx_size: 8192
  #     gpu_layers: 0      # -1 = ยกทุกชั้นไป GPU
  #     seed: 42           # deterministic seed (default: 42)
  #     temperature: 0.0   # greedy/deterministic (default: 0.0)
  #     top_p: 0.1         # (default: 0.1)
  #     top_k: 1           # greedy (default: 1)
  #     max_tokens: 2048

resources:
  cpu: 2
  memory: 1GB
  storage: 5GB

filesystem:
  read:
    - ./workspace
  write:
    - ./workspace/src

network:
  read_only: true
  allow:
    - github.com
    - crates.io

tools:
  allow:
    - filesystem.read
    - filesystem.write
    - code.search

capabilities:
  initial:
    - read:workspace
    - search:code

policy:
  require_test_before_network: true
