[package]
name = "aivm-cli"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[[bin]]
name = "aivm"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
aivm-runtime = { path = "../aivm-runtime" }
aivm-supervisor = { path = "../aivm-supervisor" }
aivm-cube = { path = "../aivm-cube" }
aivm-audit = { path = "../aivm-audit" }
aivm-sandbox = { path = "../aivm-sandbox" }

[features]
# เปิดแบ็กเอนด์ local (GGUF ผ่าน llama.cpp) ทั้งสาย cli -> supervisor -> runtime -> model
llama = ["aivm-runtime/llama", "aivm-supervisor/llama"]
# เปิด MicroVM backend (config + skeleton) ทั้งสาย cli -> runtime -> tools -> sandbox
microvm = ["aivm-runtime/microvm"]
