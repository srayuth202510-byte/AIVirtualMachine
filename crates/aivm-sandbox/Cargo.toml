[package]
name = "aivm-sandbox"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
aivm-policy = { path = "../aivm-policy" }
libc = "0.2"
sha2 = { workspace = true }
which = "5"
serde_json = { workspace = true }

[features]
default = []
# Backend MicroVM (Firecracker) — ยังไม่มี dependency จริงในขั้นเตรียมการ
# เปิดไว้เป็น seam ให้ milestone ถัดไปเติม backend โดยไม่แตะ exec path เดิม
microvm = []
# Backend Hardware Isolation (TEE/Confidential Computing) — Level 3
# ต้องการ host ที่รองรับ SEV-SNP (AMD) หรือ TDX (Intel)
hardware = []
