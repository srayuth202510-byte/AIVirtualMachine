[package]
name = "aivm-model"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
libc = { workspace = true }
thiserror = { workspace = true }
llama-cpp-2 = { version = "0.1.159", default-features = false, optional = true }
ureq = { version = "2.9", features = ["json", "charset", "cookies", "tls"] }

aivm-sandbox = { path = "../aivm-sandbox" }
aivm-policy = { path = "../aivm-policy" }

[features]
default = []
microvm = ["aivm-sandbox/microvm"]
# แบ็กเอนด์ local (GGUF ผ่าน llama.cpp) — เปิดใช้เมื่อมี cmake + toolchain C++
# ปิดไว้โดยปริยายเพื่อให้ `make verify` เบาและไม่พึ่ง cmake ใน CI
llama = ["dep:llama-cpp-2"]
