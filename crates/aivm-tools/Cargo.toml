[package]
name = "aivm-tools"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
walkdir = { workspace = true }
ureq = { version = "2.9", features = ["json", "charset", "cookies", "tls"] }
url = "2.5"
aivm-capability = { path = "../aivm-capability" }
aivm-policy = { path = "../aivm-policy" }
aivm-audit = { path = "../aivm-audit" }
aivm-cube = { path = "../aivm-cube" }
aivm-sandbox = { path = "../aivm-sandbox" }
aivm-secrets = { path = "../aivm-secrets" }

[features]
default = []
# ส่งต่อฟีเจอร์ MicroVM backend ไปยัง aivm-sandbox (config + skeleton)
# ปิดไว้โดยปริยายเพื่อให้ `make verify` เบาและไม่พึ่ง KVM ใน CI
microvm = ["aivm-sandbox/microvm"]

[dev-dependencies]
sha2 = { workspace = true }
