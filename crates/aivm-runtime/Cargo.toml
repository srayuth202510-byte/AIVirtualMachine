[package]
name = "aivm-runtime"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
libc = { workspace = true }
uuid = { workspace = true }
aivm-capability = { path = "../aivm-capability" }
aivm-policy = { path = "../aivm-policy" }
aivm-cube = { path = "../aivm-cube" }
aivm-audit = { path = "../aivm-audit" }
aivm-tools = { path = "../aivm-tools" }
aivm-memory = { path = "../aivm-memory" }
aivm-network = { path = "../aivm-network" }
aivm-secrets = { path = "../aivm-secrets" }
aivm-sandbox = { path = "../aivm-sandbox" }
aivm-model = { path = "../aivm-model" }

[features]
# ส่งต่อฟีเจอร์แบ็กเอนด์ local (llama.cpp) ไปยัง aivm-model
llama = ["aivm-model/llama"]
# ส่งต่อฟีเจอร์ MicroVM backend (config + backend) ทั้งสาย tools -> sandbox
microvm = ["aivm-model/microvm", "aivm-sandbox/microvm", "aivm-tools/microvm"]
# ส่งต่อฟีเจอร์ Hardware Isolation backend (config + backend) ทั้งสาย tools -> sandbox
hardware = ["aivm-sandbox/hardware", "aivm-tools/hardware"]
