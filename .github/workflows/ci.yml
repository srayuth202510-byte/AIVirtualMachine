# CI ของ AIVM: ล็อกเกตคุณภาพทุก push/PR ห้าม main พังเงียบ
# งานตรงกับ `make ci` ในเครื่อง (verify + e2e + microvm + hardware) ใช้
# ubuntu ตัวเดียว เพราะ milestone ถัดไป (sandbox) พึ่งพา Linux อยู่แล้ว
# หมายเหตุ: runner ไม่มี KVM เทสต์บูตจริงจึง skip อย่างซื่อสัตย์ เหลือ
# unit/adversarial/plumbing ที่ deterministic ไว้จับโค้ดหลังฟีเจอร์พัง
name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: ติดตั้ง Rust stable + clippy + rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: แคช cargo (ให้รอบถัดไปเร็ว)
        uses: Swatinem/rust-cache@v2

      - name: ฟอร์แมตต้องไม่เพี้ยน
        run: cargo fmt --all -- --check

      - name: lint แบบ strict (เจอ warning คือตก)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: เทสต์ทั้ง workspace (รวม adversarial)
        run: cargo test --workspace

      - name: ทดสอบตัวตรวจคำตอบและ audit reviewer (ไม่ต้องใช้โมเดล)
        run: |
          python3 -m unittest discover -s scripts -p 'test_qwen_*.py'
          python3 -m unittest discover -s scripts -p 'test_supervisor.py'
          python3 -m unittest discover -s scripts -p 'test_detection.py'
          python3 -m unittest discover -s scripts -p 'test_immunity.py'
          python3 -m unittest discover -s scripts -p 'test_pins.py'
          python3 scripts/eval-qwen-audit.py
          python3 scripts/smoke-qwen-watch.py

      - name: lint โค้ดหลังฟีเจอร์ microvm (กันแก้พังเงียบ)
        run: cargo clippy -p aivm-sandbox -p aivm-tools -p aivm-runtime -p aivm-cli --all-targets --features microvm -- -D warnings

      - name: เทสต์ MicroVM แบบมีฟีเจอร์ (บูตจริงข้ามเมื่อไม่มี KVM)
        run: make test-microvm

      - name: lint โค้ดหลังฟีเจอร์ hardware (กันแก้พังเงียบ)
        run: make check-hardware

      - name: เทสต์ Hardware Isolation แบบมีฟีเจอร์ (บูตจริงข้ามเมื่อไม่มี KVM)
        run: make test-hardware

      - name: self-test เส้น enforcement (14 เคส ALLOW/DENY)
        run: cargo run -q -p aivm-cli -- demo

      - name: วงจร CLI ครบ (create/transition/inspect/run/logs)
        run: sh scripts/smoke.sh

  # บูตจริงต้องมี KVM — รันเฉพาะ runner ที่ติดป้าย kvm และเปิด vars.AIVM_ENABLE_KVM=1
  # (GitHub-hosted ไม่มี KVM งานนี้จะ skip ไปเลย ไม่ทำให้ main แดง)
  kvm-real-boot:
    runs-on: [self-hosted, linux, kvm]
    if: vars.AIVM_ENABLE_KVM == '1'
    steps:
      - uses: actions/checkout@v5

      - name: ติดตั้ง Rust stable + clippy + rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: ตรวจ host (อ่านอย่างเดียว)
        run: sh scripts/setup-host.sh

      - name: บูต MicroVM จริง (ต้องมี AIVM_MICROVM_PINS บน runner)
        run: |
          if [ -z "${AIVM_MICROVM_PINS:-}" ]; then
            echo "no AIVM_MICROVM_PINS — skip honestly (no real boot claimed)"
            exit 0
          fi
          make test-microvm

      - name: บูต Hardware generic จริง (ถ้ามี pins)
        run: |
          if [ -z "${AIVM_HARDWARE_PINS:-}" ]; then
            echo "no AIVM_HARDWARE_PINS — skip honestly"
            exit 0
          fi
          make test-hardware
