[workspace]
members = [
    "crates/aivm-capability",
    "crates/aivm-policy",
    "crates/aivm-cube",
    "crates/aivm-audit",
    "crates/aivm-tools",
    "crates/aivm-memory",
    "crates/aivm-network",
    "crates/aivm-sandbox",
    "crates/aivm-model",
    "crates/aivm-model-worker",
    "crates/aivm-runtime",
    "crates/aivm-supervisor",
    "crates/aivm-cli",
    "crates/aivm-adversarial",
    "crates/aivm-secrets",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
libc = "0.2"
chrono = "0.4"
glob = "0.3"
walkdir = "2"
uuid = { version = "1", features = ["v4", "serde"] }
