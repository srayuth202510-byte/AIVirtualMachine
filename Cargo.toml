[workspace]
members = [
    # ลำดับตามชั้น dependency ตาราง Crate map ใน docs/architecture.md
    # (ชั้น 0–7 ชั้นล่างไม่พึ่งชั้นบน) — `adversarial` เป็นชุดเทสต์ dev-deps
    "crates/aivm-capability",
    "crates/aivm-cube",
    "crates/aivm-audit",
    "crates/aivm-policy",
    "crates/aivm-sandbox",
    "crates/aivm-network",
    "crates/aivm-memory",
    "crates/aivm-secrets",
    "crates/aivm-model",
    "crates/aivm-tools",
    "crates/aivm-model-worker",
    "crates/aivm-runtime",
    "crates/aivm-supervisor",
    "crates/aivm-cli",
    "crates/aivm-adversarial",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# serde_yaml ถูก archive แล้ว (RUSTSEC-2024-0320) — ใช้ fork ที่ยังดูแล ใช้งานแบบ drop-in
serde_yaml_ng = "0.10"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
libc = "0.2"
chrono = "0.4"
glob = "0.3"
walkdir = "2"
uuid = { version = "1", features = ["v4", "serde"] }

# ทุก unsafe block ต้องมี `// SAFETY:` อธิบาย invariant (clippy -D warnings บังคับเป็น error)
[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
